$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://example.invalid/schema/workflow-app.schema.yaml"

title: Splunk CRUD Factory Workflow App
description: >
  Schema for generating a Splunk application containing app.conf metadata,
  a KV Store collection, KV Store lookup transformations, and Simple XML
  dashboards.

type: object
additionalProperties: false

required:
  - version
  - app

properties:
  version:
    type: string
    const: "1"

  app:
    $ref: "#/$defs/app"

$defs:
  identifier:
    type: string
    minLength: 1
    maxLength: 128
    pattern: "^[A-Za-z][A-Za-z0-9_-]*$"

  nonEmptyString:
    type: string
    minLength: 1

  relativePath:
    type: string
    minLength: 1
    pattern: "^(?![/\\\\])(?!.*(?:^|[/\\\\])\\.\\.(?:[/\\\\]|$)).+$"

  assetPath:
    type: string
    minLength: 1
    pattern: "^(?![/\\\\])(?!.*(?:^|[/\\\\])\\.\\.(?:[/\\\\]|$)).+\\.(?:js|css)$"

  app:
    type: object
    additionalProperties: false

    required:
      - id
      - app_conf
      - collection
      - transforms
      - dashboards

    properties:
      id:
        $ref: "#/$defs/identifier"

      app_conf:
        $ref: "#/$defs/appConf"

      dashboard:
        $ref: "#/$defs/dashboardDefaults"

      collection:
        $ref: "#/$defs/collection"

      transforms:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: "#/$defs/transform"

      dashboards:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/dashboard"

  appConf:
    type: object
    additionalProperties: false

    required:
      - id
      - launcher
      - install
      - package
      - ui

    properties:
      id:
        type: object
        additionalProperties: false
        required:
          - name
        properties:
          name:
            $ref: "#/$defs/identifier"

      launcher:
        type: object
        additionalProperties: false
        required:
          - version
          - author
          - description
        properties:
          version:
            type: string
            minLength: 1
          author:
            $ref: "#/$defs/nonEmptyString"
          description:
            $ref: "#/$defs/nonEmptyString"
          label:
            $ref: "#/$defs/nonEmptyString"

      install:
        type: object
        additionalProperties: false
        required:
          - state
          - build
        properties:
          state:
            type: string
            enum:
              - enabled
              - disabled
          build:
            oneOf:
              - type: string
                minLength: 1
              - type: integer
                minimum: 0

      package:
        type: object
        additionalProperties: false
        required:
          - id
        properties:
          id:
            $ref: "#/$defs/identifier"

      ui:
        type: object
        additionalProperties: false
        required:
          - is_visible
          - label
        properties:
          is_visible:
            type: boolean
          label:
            $ref: "#/$defs/nonEmptyString"

  dashboardDefaults:
    type: object
    additionalProperties: false

    properties:
      scripts:
        type: array
        uniqueItems: true
        items:
          allOf:
            - $ref: "#/$defs/assetPath"
            - pattern: "\\.js$"

      stylesheets:
        type: array
        uniqueItems: true
        items:
          allOf:
            - $ref: "#/$defs/assetPath"
            - pattern: "\\.css$"

  collection:
    type: object
    additionalProperties: false

    required:
      - name
      - fields

    properties:
      name:
        $ref: "#/$defs/identifier"

      fields:
        type: object
        additionalProperties: false

        required:
          - user
          - timestamp
          - message
          - status
          - urgency
          - object

        properties:
          user:
            $ref: "#/$defs/collectionField"

          timestamp:
            $ref: "#/$defs/collectionField"

          message:
            $ref: "#/$defs/collectionField"

          status:
            $ref: "#/$defs/collectionField"

          urgency:
            $ref: "#/$defs/collectionField"

          object:
            $ref: "#/$defs/collectionField"

  collectionField:
    type: object
    additionalProperties: false
    required:
      - type

    properties:
      type:
        type: string
        enum:
          - string
          - number
          - bool
          - time

  transform:
    type: object
    additionalProperties: false

    required:
      - name
      - collection
      - fields

    properties:
      name:
        $ref: "#/$defs/identifier"

      collection:
        $ref: "#/$defs/identifier"

      fields:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
            - user
            - timestamp
            - message
            - status
            - urgency
            - object

  dashboard:
    type: object
    additionalProperties: false

    required:
      - id
      - label

    properties:
      id:
        $ref: "#/$defs/identifier"

      label:
        $ref: "#/$defs/nonEmptyString"

      description:
        type: string

      source:
        allOf:
          - $ref: "#/$defs/relativePath"
          - pattern: "\\.xml$"

      include_in_nav:
        type: boolean
        default: true

      scripts:
        type: array
        uniqueItems: true
        items:
          allOf:
            - $ref: "#/$defs/assetPath"
            - pattern: "\\.js$"

      stylesheets:
        type: array
        uniqueItems: true
        items:
          allOf:
            - $ref: "#/$defs/assetPath"
            - pattern: "\\.css$"
